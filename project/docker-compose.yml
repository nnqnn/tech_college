x-app-env: &app-env
  DATABASE_URL: postgresql://dating:dating@postgres:5432/dating
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://dating:dating@rabbitmq:5672/
  EVENT_QUEUE_NAME: dating.events
  MQ_ENABLED: "true"
  CELERY_BROKER_URL: amqp://dating:dating@rabbitmq:5672/
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CELERY_ENABLED: "true"
  RATING_REFRESH_INTERVAL_SECONDS: "300"
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY_ID: dating
  S3_SECRET_ACCESS_KEY: dating-secret
  S3_BUCKET_NAME: dating-photos
  S3_REGION_NAME: us-east-1
  METRICS_ENABLED: "true"
  STRUCTURED_LOGGING: "true"

services:
  backend:
    image: python:3.12-slim
    container_name: dating-backend
    working_dir: /app
    environment:
      <<: *app-env
    volumes:
      - .:/app
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - minio

  postgres:
    image: postgres:16-alpine
    container_name: dating-postgres
    environment:
      POSTGRES_DB: dating
      POSTGRES_USER: dating
      POSTGRES_PASSWORD: dating
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dating -d dating"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dating-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dating-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: dating
      RABBITMQ_DEFAULT_PASS: dating
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: dating-minio
    environment:
      MINIO_ROOT_USER: dating
      MINIO_ROOT_PASSWORD: dating-secret
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: dating-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 dating dating-secret; do sleep 2; done &&
      mc mb --ignore-existing local/dating-photos &&
      mc anonymous set none local/dating-photos
      "

  celery-worker:
    image: python:3.12-slim
    container_name: dating-celery-worker
    working_dir: /app
    environment:
      <<: *app-env
      WORKER_METRICS_PORT: "9101"
    volumes:
      - .:/app
    command: >
      sh -c "pip install -r requirements.txt &&
             celery -A worker.celery_app worker --loglevel=INFO"
    ports:
      - "9101:9101"
    depends_on:
      - postgres
      - redis
      - rabbitmq

  celery-beat:
    image: python:3.12-slim
    container_name: dating-celery-beat
    working_dir: /app
    environment:
      <<: *app-env
      METRICS_ENABLED: "false"
    volumes:
      - .:/app
    command: >
      sh -c "pip install -r requirements.txt &&
             celery -A worker.celery_app beat --loglevel=INFO"
    depends_on:
      - redis
      - rabbitmq

  prometheus:
    image: prom/prometheus:latest
    container_name: dating-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - celery-worker

  grafana:
    image: grafana/grafana:latest
    container_name: dating-grafana
    environment:
      GF_SECURITY_ADMIN_USER: dating
      GF_SECURITY_ADMIN_PASSWORD: dating
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  minio_data:
  grafana_data:
